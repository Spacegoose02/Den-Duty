services:
  den-duty:
    image: ghcr.io/spacegoose02/den-duty:latest
    # To build from this folder instead of pulling: comment out "image" and uncomment "build".
    # build: .
    container_name: den-duty
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}

  # Optional: natural-sounding read-aloud voices (Settings → Read-aloud voice → http://kokoro:8880). See docs/read-aloud.md.
  # kokoro:
  #   image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
  #   container_name: kokoro
  #   restart: unless-stopped
  #   ports:
  #     - "8880:8880"
